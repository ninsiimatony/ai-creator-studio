# Manual deploy to the dedicated Cloudflare Worker "youtube-automation-platform".
# Runs ONLY when you press "Run workflow" in the GitHub Actions tab. It never runs on push.
#
# One-time setup (repository Settings -> Secrets and variables -> Actions):
#   secret   CLOUDFLARE_API_TOKEN   an API token with "Edit Cloudflare Workers" permission for your account
#   secret   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   variable DEPLOY_URL (optional)  e.g. https://youtube-automation-platform.<subdomain>.workers.dev
#                                   when set, the workflow health-checks it after deploying
name: Deploy to Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type check and tests (must pass before anything is deployed)
        run: |
          npx tsc --noEmit
          bun run test
      - run: bun run build
      - name: Deploy the Worker (uses wrangler.jsonc: dedicated Worker, D1 youtube-automation-db, AI binding)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check the live site
        if: ${{ vars.DEPLOY_URL != '' }}
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS "${{ vars.DEPLOY_URL }}/api/health" || true)
            echo "attempt $i: $out"
            echo "$out" | grep -q '"database":"d1"' && exit 0
            sleep 10
          done
          echo "The site did not report a healthy D1 connection" >&2
          exit 1
