name: video-bot
run-name: ${{ inputs.topic || 'video-bot' }}

# Started by the Telegram bot (through the studio). Makes a video with free tools and uploads it to YouTube as PRIVATE.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Video topic
        required: true
      minutes:
        description: Length in minutes
        required: true
        default: "10"
      style:
        description: real or cartoon
        required: true
        default: real
      tone:
        description: emotional (optional)
        required: false
        default: ""
      channel:
        description: 2 for the second channel (optional)
        required: false
        default: ""

concurrency:
  group: video-bot
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg and a subtitle font
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil && (python3 -m pip install --user --break-system-packages edge-tts || pip3 install --user edge-tts || true)
      - name: Install the Kaggle CLI (only used if USE_LTX_VIDEO=1)
        if: vars.USE_LTX_VIDEO == '1'
        run: python3 -m pip install --user --break-system-packages kaggle || pip3 install --user kaggle
      - name: Pick today's story (scheduled runs)
        if: github.event_name == 'schedule'
        run: node scripts/video-bot/pick-topic.mjs >> "$GITHUB_ENV"
      - name: Make the video
        env:
          STUDIO_URL: https://youtube-automation-platform.ninsiimatony.workers.dev
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          TOPIC: ${{ inputs.topic || env.TOPIC }}
          MINUTES: ${{ inputs.minutes || env.MINUTES }}
          STYLE: ${{ inputs.style || env.STYLE }}
          TONE: ${{ inputs.tone || env.TONE }}
          CHANNEL: ${{ inputs.channel }}
          BLOCK_ON_HIGH: ${{ vars.BLOCK_ON_HIGH }}
          # Optional LTX-Video upgrade (moving clips instead of still pictures/stock clips), off
          # unless USE_LTX_VIDEO=1 is set as a repo variable AND both Kaggle secrets are set.
          USE_LTX_VIDEO: ${{ vars.USE_LTX_VIDEO }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: node scripts/video-bot/run.mjs
