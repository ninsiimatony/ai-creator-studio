name: video-bot
run-name: ${{ inputs.topic || 'video-bot' }}

# Started by the Telegram bot (through the studio). Makes a video with free tools and uploads it to YouTube as PRIVATE.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: Video topic
        required: true
      minutes:
        description: Length in minutes
        required: true
        default: "10"
      style:
        description: real or cartoon
        required: true
        default: real
      tone:
        description: emotional, scary or wonder (optional)
        required: false
        default: ""
      channel:
        description: 2, 3 or 4 for the second, third or fourth channel (optional)
        required: false
        default: ""

concurrency:
  group: video-bot
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ffmpeg and a subtitle font
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil && (python3 -m pip install --user --break-system-packages edge-tts || pip3 install --user edge-tts || true)
      # Kokoro free voice (Apache-2.0). Only for channels listed in the repo variable KOKORO_CHANNELS (default "3").
      - name: Cache the Kokoro voice model
        if: contains(format(',{0},', vars.KOKORO_CHANNELS || '3'), format(',{0},', inputs.channel || '1'))
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-model-v1.0
      - name: Install the Kokoro voice
        if: contains(format(',{0},', vars.KOKORO_CHANNELS || '3'), format(',{0},', inputs.channel || '1'))
        continue-on-error: true
        run: |
          python3 -m pip install --user --break-system-packages kokoro-onnx soundfile || pip3 install --user kokoro-onnx soundfile
          mkdir -p ~/kokoro
          [ -s ~/kokoro/kokoro-v1.0.onnx ] || curl -sSfL -o ~/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -s ~/kokoro/voices-v1.0.bin ] || curl -sSfL -o ~/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          ls -la ~/kokoro
      - name: Install the Kaggle CLI (only used if USE_LTX_VIDEO=1)
        if: vars.USE_LTX_VIDEO == '1'
        run: python3 -m pip install --user --break-system-packages kaggle || pip3 install --user kaggle
      - name: Pick today's story (scheduled runs)
        if: github.event_name == 'schedule'
        run: node scripts/video-bot/pick-topic.mjs >> "$GITHUB_ENV"
      - name: Make the video
        env:
          STUDIO_URL: https://youtube-automation-platform.ninsiimatony.workers.dev
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          TOPIC: ${{ inputs.topic || env.TOPIC }}
          MINUTES: ${{ inputs.minutes || env.MINUTES }}
          STYLE: ${{ inputs.style || env.STYLE }}
          TONE: ${{ inputs.tone || env.TONE }}
          CHANNEL: ${{ inputs.channel }}
          BLOCK_ON_HIGH: ${{ vars.BLOCK_ON_HIGH }}
          # Optional LTX-Video upgrade (moving clips instead of still pictures/stock clips), off
          # unless USE_LTX_VIDEO=1 is set as a repo variable AND both Kaggle secrets are set.
          USE_LTX_VIDEO: ${{ vars.USE_LTX_VIDEO }}
          LTX_CHANNELS: ${{ vars.LTX_CHANNELS }}
          # Channel 3's Google address (only used to open the right account in Telegram links). Optional repo variable.
          CH3_EMAIL: ${{ vars.CH3_EMAIL }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          KOKORO_CHANNELS: ${{ vars.KOKORO_CHANNELS }}
          # Channel 4 (Night Tales Uganda): Luganda text and voice from Sunbird AI
          SUNBIRD_API_TOKEN: ${{ secrets.SUNBIRD_API_TOKEN }}
          SUNBIRD_VOICE: ${{ vars.SUNBIRD_VOICE }}
          CH4_AUTO_PUBLISH: ${{ vars.CH4_AUTO_PUBLISH }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: node scripts/video-bot/run.mjs
      - name: Keep the video recipe (backup, 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-${{ github.run_id }}
          path: recipes/
          retention-days: 90
          if-no-files-found: ignore
      - name: Alarm - tell Tony on Telegram if this run crashed
        if: failure() || cancelled()
        env:
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ inputs.topic || 'scheduled video' }}
          CH: ${{ inputs.channel || '1' }}
        run: |
          TEXT="🚨 Robot alarm: a video run stopped with an error (channel ${CH}). It will retry automatically.
          Topic: ${WHAT}
          Details: ${RUN_URL}"
          export TEXT
          node -e 'fetch("https://youtube-automation-platform.ninsiimatony.workers.dev/api/automation/notify",{method:"POST",headers:{authorization:"Bearer "+process.env.AUTOMATION_SECRET,"content-type":"application/json"},body:JSON.stringify({text:process.env.TEXT})}).then(r=>console.log("alarm sent",r.status)).catch(e=>console.log("alarm failed",e.message))'
      - name: Keep the Kaggle clips for checking (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-clips
          path: /tmp/videobot/**/clip*.mp4
          retention-days: 3
          if-no-files-found: ignore
